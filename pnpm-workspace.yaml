allowBuilds:
  "@biomejs/biome": true
  "@clerk/shared": true
  esbuild: true
  # Only the browser tokenizer is used; the native runtime is never loaded.
  onnxruntime-node: false
  protobufjs: true
  sharp: true
overrides:
  # Typography pins 6.0.10; GHSA-rj75-hqrm-r3gf is fixed in 6.1.5.
  "@tailwindcss/typography>postcss-selector-parser": 6.1.5
permissions:
  "@trpc/client":
    skills: [client-setup, links, superjson]
  "@trpc/server":
    skills: [server-setup, adapter-fetch, trpc-router, middlewares, error-handling, validators, auth, server-side-calls]
  "@tanstack/match-sorter-utils":
    skills: false
skills:
  dirs:
    - .claude/skills
    - .agents/skills
